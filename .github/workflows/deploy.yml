name: Test, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/ravshan04/multi-container-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker compose config --quiet

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          SHA: ${{ github.sha }}
        run: echo "reference=${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.reference }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload Compose configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SERVER_HOST}" \
            "sudo mkdir -p /opt/multi-container-service/nginx && sudo chown -R '${SSH_USER}:${SSH_USER}' /opt/multi-container-service"
          scp -i ~/.ssh/deploy_key docker-compose.yml "${SSH_USER}@${SERVER_HOST}:/opt/multi-container-service/"
          scp -i ~/.ssh/deploy_key nginx/default.conf "${SSH_USER}@${SERVER_HOST}:/opt/multi-container-service/nginx/"

      - name: Deploy Compose stack
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE: ${{ needs.build-and-push.outputs.image }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        run: |
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SERVER_HOST}" \
            "printf '%s' '$GHCR_TOKEN' | sudo timeout 30s docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SERVER_HOST}" \
            "sudo systemctl disable --now nginx 2>/dev/null || true; \
            cd /opt/multi-container-service && printf '%s\n' \
            'API_IMAGE=$API_IMAGE' \
            'MONGO_ROOT_USERNAME=$MONGO_ROOT_USERNAME' \
            'MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD' > .env && \
            sudo docker compose pull && sudo docker compose up -d --remove-orphans"

      - name: Verify API
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          curl --fail --retry 15 --retry-delay 4 "http://${SERVER_HOST}/health"
          curl --fail "http://${SERVER_HOST}/todos"
