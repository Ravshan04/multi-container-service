name: Test, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ravshan04/multi-container-service

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker compose config --quiet

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          SHA: ${{ github.sha }}
        run: echo "reference=${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.reference }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload deployment configuration
        timeout-minutes: 3
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH_OPTS='-o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3'
          timeout 60s ssh -i ~/.ssh/deploy_key $SSH_OPTS -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SERVER_HOST}" \
            "sudo mkdir -p /opt/multi-container-service/nginx /opt/multi-container-service/monitoring/grafana/provisioning/datasources /opt/multi-container-service/monitoring/grafana/provisioning/dashboards /opt/multi-container-service/monitoring/grafana/dashboards /opt/multi-container-service/scripts /opt/multi-container-service/state && sudo chown '${SSH_USER}:${SSH_USER}' /opt/multi-container-service && sudo chown -R '${SSH_USER}:${SSH_USER}' /opt/multi-container-service/nginx /opt/multi-container-service/monitoring /opt/multi-container-service/scripts /opt/multi-container-service/state"
          scp -i ~/.ssh/deploy_key $SSH_OPTS docker-compose.yml "${SSH_USER}@${SERVER_HOST}:/opt/multi-container-service/"
          scp -i ~/.ssh/deploy_key $SSH_OPTS nginx/default.conf.template "${SSH_USER}@${SERVER_HOST}:/opt/multi-container-service/nginx/"
          scp -i ~/.ssh/deploy_key $SSH_OPTS monitoring/blackbox.yml monitoring/prometheus.yml monitoring/alerts.yml monitoring/recording-rules.yml "${SSH_USER}@${SERVER_HOST}:/opt/multi-container-service/monitoring/"
          scp -i ~/.ssh/deploy_key $SSH_OPTS monitoring/grafana/provisioning/datasources/prometheus.yml "${SSH_USER}@${SERVER_HOST}:/opt/multi-container-service/monitoring/grafana/provisioning/datasources/"
          scp -i ~/.ssh/deploy_key $SSH_OPTS monitoring/grafana/provisioning/dashboards/dashboards.yml "${SSH_USER}@${SERVER_HOST}:/opt/multi-container-service/monitoring/grafana/provisioning/dashboards/"
          scp -i ~/.ssh/deploy_key $SSH_OPTS monitoring/grafana/dashboards/todo-service.json "${SSH_USER}@${SERVER_HOST}:/opt/multi-container-service/monitoring/grafana/dashboards/"
          scp -i ~/.ssh/deploy_key $SSH_OPTS scripts/deploy-blue-green.sh "${SSH_USER}@${SERVER_HOST}:/opt/multi-container-service/scripts/"

      - name: Configure deployment environment
        timeout-minutes: 2
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          API_IMAGE: ${{ needs.build-and-push.outputs.image }}
          APP_VERSION: ${{ github.sha }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          SSH_OPTS='-o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3'
          umask 077
          {
            printf 'API_IMAGE=%s\n' "$API_IMAGE"
            printf 'APP_VERSION=%s\n' "$APP_VERSION"
            printf 'MONGO_ROOT_USERNAME=%s\n' "$MONGO_ROOT_USERNAME"
            printf 'MONGO_ROOT_PASSWORD=%s\n' "$MONGO_ROOT_PASSWORD"
            printf 'GRAFANA_ADMIN_USER=%s\n' "$GRAFANA_ADMIN_USER"
            printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$GRAFANA_ADMIN_PASSWORD"
          } > deploy.env
          timeout 60s scp -i ~/.ssh/deploy_key $SSH_OPTS deploy.env "${SSH_USER}@${SERVER_HOST}:/opt/multi-container-service/.env"
          rm -f deploy.env
          timeout 60s ssh -i ~/.ssh/deploy_key $SSH_OPTS "${SSH_USER}@${SERVER_HOST}" "chmod 600 /opt/multi-container-service/.env"

      - name: Deploy blue-green stack
        timeout-minutes: 8
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH_OPTS='-o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3'
          timeout 60s ssh -i ~/.ssh/deploy_key $SSH_OPTS "${SSH_USER}@${SERVER_HOST}" \
            "sudo timeout 30s docker login ghcr.io -u '${{ github.actor }}' --password-stdin" <<< "$GHCR_TOKEN"
          timeout 60s ssh -i ~/.ssh/deploy_key $SSH_OPTS "${SSH_USER}@${SERVER_HOST}" \
            "sudo systemctl disable --now nginx 2>/dev/null || true"
          timeout 6m ssh -i ~/.ssh/deploy_key $SSH_OPTS "${SSH_USER}@${SERVER_HOST}" \
            "cd /opt/multi-container-service && bash scripts/deploy-blue-green.sh"

      - name: Verify API
        timeout-minutes: 3
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH_OPTS='-o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3'
          curl --fail --retry 15 --retry-delay 4 "http://${SERVER_HOST}/health"
          curl --fail "http://${SERVER_HOST}/todos"
          timeout 60s ssh -i ~/.ssh/deploy_key $SSH_OPTS "${SSH_USER}@${SERVER_HOST}" \
            "curl --fail --silent http://127.0.0.1:19090/-/ready && curl --fail --silent http://127.0.0.1:13001/api/health"
