groups:
  - name: application-recording-rules
    interval: 30s
    rules:
      - record: todo_api:http_requests:rate5m
        expr: sum by (method, route, status_code) (rate(todo_api_http_requests_total[5m]))
      - record: todo_api:http_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le, route) (rate(todo_api_http_request_duration_seconds_bucket[5m])))
